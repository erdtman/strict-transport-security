name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes whatever is still running for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is end-of-life upstream but is what `engines` promises, so it
        # stays until that floor is raised. 26 is the current release line.
        node-version: ['20', '22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      # No install step: this package has no dependencies, runtime or dev.
      - run: node --test

  # The publish workflow upgrades npm before it packs the tarball, so the suite
  # has to pass on that npm too. npm 12 changed the shape of `npm pack --json`,
  # which only the release run would otherwise have discovered.
  npm-latest:
    name: test (npm latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install -g npm@latest
      - run: node --test

  # The default suite skips the real frameworks, so that `npm test` needs no
  # dependencies. They are installed here instead, which is what catches a
  # breaking change in one of them before a user does.
  frameworks:
    name: test (real frameworks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm run test:frameworks

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm run coverage:check

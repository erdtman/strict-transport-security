name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Required for trusted publishing: lets the job mint an OIDC token that npm
  # verifies to attest where this package was built from. Provenance is then
  # generated automatically, with no --provenance flag needed.
  id-token: write

jobs:
  stage:
    name: stage release on npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # `npm stage publish` needs npm 11.15.0 or later, which is newer than
      # the npm bundled with Node 24.
      - run: npm install -g npm@latest

      - name: Verify the tag matches package.json
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: npm run coverage:check

      # Submits the tarball to npm's staging area. It does not go live until a
      # maintainer approves it with 2FA, which cannot be done from CI.
      # Prints the stage id needed to approve the release.
      - run: npm stage publish
